name: json_strict
role: json
description: The model must produce valid, minimal JSON with no surrounding text.
cases:
  - name: bool_flag
    prompt: |
      Reply ONLY with a valid JSON object containing the key "ok" set to true.
      No surrounding text, no Markdown fences.
    checks:
      - json_valid
      - contains:ok
  - name: list_three
    prompt: |
      Reply ONLY with a JSON array of three integers: 1, 2, 3.
    checks:
      - json_valid
      - non_empty
