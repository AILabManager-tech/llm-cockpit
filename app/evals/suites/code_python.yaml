name: code_python
role: code
description: Small Python functions. Generated code is never executed.
cases:
  - name: add_function
    prompt: |
      Write a Python function named add that takes a and b and returns their
      sum. Give the code only, no explanation.
    checks:
      - non_empty
      - contains:def add
  - name: hello_print
    prompt: "Write print('hello') in Python. Give the code only."
    checks:
      - contains:print
      - latency_lt:60000
