{% extends "base.html" %}

{% block content %}
<section class="controls">
  <a class="btn-refresh" href="/">← Inventaire</a>
  <button
    class="btn-refresh"
    hx-get="/partials/dashboard"
    hx-target="#dashboard-panel"
    hx-swap="innerHTML">
    Rafraîchir
  </button>
  <span class="poll-note">Activité gateway — rafraîchissement toutes les 5&nbsp;s</span>
</section>

<div
  id="dashboard-panel"
  hx-get="/partials/dashboard"
  hx-trigger="every 5s, refresh"
  hx-swap="innerHTML">
  {% include "partials/dashboard.html" %}
</div>

<div
  id="scoreboard-panel"
  hx-get="/partials/scoreboard"
  hx-trigger="refresh"
  hx-swap="innerHTML">
  {% include "partials/scoreboard.html" %}
</div>

<div
  id="rag-panel"
  hx-get="/partials/rag"
  hx-trigger="refresh"
  hx-swap="innerHTML">
  {% include "partials/rag_panel.html" %}
</div>

<div
  id="training-panel"
  hx-get="/partials/training"
  hx-trigger="every 10s, refresh"
  hx-swap="innerHTML">
  {% include "partials/training_panel.html" %}
</div>
{% endblock %}
