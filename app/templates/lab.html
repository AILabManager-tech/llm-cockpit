{% extends "base.html" %}

{% block content %}
<section class="controls">
  <span class="poll-note">
    Measure, then improve: evaluations gate what RAG and adaptation are worth.
  </span>
</section>

<div
  id="scoreboard-panel"
  hx-get="/partials/scoreboard"
  hx-trigger="refresh"
  hx-swap="innerHTML">
  {% include "partials/scoreboard.html" %}
</div>

<div
  id="rag-panel"
  hx-get="/partials/rag"
  hx-trigger="refresh"
  hx-swap="innerHTML">
  {% include "partials/rag_panel.html" %}
</div>

<div
  id="training-panel"
  hx-get="/partials/training"
  hx-trigger="every 10s, refresh"
  hx-swap="innerHTML">
  {% include "partials/training_panel.html" %}
</div>
{% endblock %}
