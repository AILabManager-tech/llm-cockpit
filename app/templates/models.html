{% extends "base.html" %}

{% block content %}
<section class="controls">
  <button
    class="btn-refresh"
    hx-get="/partials/models"
    hx-target="#models-panel"
    hx-swap="innerHTML">
    Refresh
  </button>
  <span class="poll-note">Auto-refresh every 5&nbsp;s</span>
</section>

<div
  id="models-panel"
  hx-get="/partials/models"
  hx-trigger="every 5s, refresh"
  hx-swap="innerHTML">
  {% include "partials/models_table.html" %}
</div>

{% if actions_enabled %}
<section class="actions-controls">
  <h2>Test a model</h2>
  <form
    hx-post="/api/actions/test"
    hx-ext="json-enc"
    hx-swap="none"
    hx-disabled-elt="find button"
    hx-on::after-request="htmx.trigger('#actions-panel', 'refresh')">
    <select name="model" aria-label="Model to test">
      {% for m in models %}
      <option value="{{ m.normalized_name }}">{{ m.normalized_name }}</option>
      {% endfor %}
    </select>
    <input type="text" name="prompt" value="Reply OK." aria-label="Test prompt">
    <button type="submit" class="btn-refresh">Test</button>
  </form>
  <p class="poll-note">The result appears in the action log below.</p>
</section>
{% endif %}

<div
  id="actions-panel"
  hx-get="/partials/actions"
  hx-trigger="every 5s, refresh"
  hx-swap="innerHTML">
  {% include "partials/actions_panel.html" %}
</div>
{% endblock %}
