[project]
name = "llm-cockpit"
version = "0.1.0"
description = "LLM Cockpit V0 — local-first read-only cockpit for Ollama inventory"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pypdf>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=5.4",
    "pyinstaller>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
